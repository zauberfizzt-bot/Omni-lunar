name: OMNI Lunar · Publicación web
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'web-app.js'
      - 'sw.js'
      - 'install.js'
      - 'ephemerides.js'
      - 'manifest.webmanifest'
      - 'version.json'
      - 'icon*'
      - 'push-config.json'
      - 'scripts/build-icons.py'
      - '.github/workflows/publish-web.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: omni-web-publication
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and package static app
        run: |
          set -eu
          node --check web-app.js
          node --check sw.js
          node --check install.js
          node --check ephemerides.js
          node -e 'for(const f of ["version.json","manifest.webmanifest"])JSON.parse(require("fs").readFileSync(f,"utf8"))'
          python -m pip install Pillow==11.3.0
          python scripts/build-icons.py
          mkdir site
          cp index.html web-app.js sw.js install.js ephemerides.js manifest.webmanifest version.json push-config.json icon.svg icon-192.png icon-512.png icon-maskable.png resonances.json delivery-status.json fallback.json .nojekyll site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: https://zauberfizzt-bot.github.io/Omni-lunar/
    steps:
      - name: Publish app
        id: first
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 300000
      - name: Retry publication if GitHub rejects first attempt
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
      - uses: actions/checkout@v4
      - name: Verify live version
        run: |
          expected=$(jq -er .release version.json)
          for i in $(seq 1 12); do
            actual=$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "https://zauberfizzt-bot.github.io/Omni-lunar/version.json?check=$(date +%s)" | jq -r .release || true)
            if [ "$actual" = "$expected" ]; then
              echo "Published version verified: $expected"
              exit 0
            fi
            sleep 5
          done
          echo "Live version did not match $expected" >&2
          exit 1
