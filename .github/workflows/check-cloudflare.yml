name: OMNI Lunar · Validación Cloudflare
on:
  push:
    branches: [main]
    paths: ['cloudflare/**', 'wrangler.jsonc', 'package.json', '.github/workflows/check-cloudflare.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm run check
